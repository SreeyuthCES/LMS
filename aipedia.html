    body {
      font-family: 'Manrope', sans-serif;

      background-attachment: fixed;
      overflow-x: hidden;

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(74, 130, 163, 0.4); border-radius: 10px; }

      position: absolute; top: 0; left: 0; width: 100%; height: 40vh; min-height: 380px; z-index: 0;

  <script>
    // --- SMART IMAGE FALLBACK LOGIC ---
    window.handleThumbnailError = function(imgElement, originalSrc) {
      const attempts = parseInt(imgElement.getAttribute('data-attempts') || '0');
      const fallbackMap = ['.png', '.jpeg'];
      
      if (attempts < fallbackMap.length) {
        imgElement.setAttribute('data-attempts', attempts + 1);
        const basePath = originalSrc.replace(/\.[^/.]+$/, "");
        imgElement.src = basePath + fallbackMap[attempts];
      } else {
        imgElement.src = 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&q=80&w=400';
      }
    };
    // --- VIDEO MODAL LOGIC ---
    function scrollVideoCarousel(button, direction) {
      const carousel = button.closest('[data-video-carousel]');
      const track = carousel && carousel.querySelector('.video-carousel-track');
      if (!track) return;
      track.scrollBy({ left: direction * track.clientWidth * 0.8, behavior: 'smooth' });
    }

    function openVideoModal(videoUrl) {
      const modal = document.getElementById('video-modal');
      const content = document.getElementById('video-modal-content');
      const player = document.getElementById('modal-video-player');

      document.body.style.overflow = 'hidden';
      document.body.classList.add('video-modal-open');

      player.src = videoUrl;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      void modal.offsetWidth;
      modal.classList.remove('opacity-0');
      content.classList.remove('scale-95');

      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }
    }

    function closeVideoModal() {
      const modal = document.getElementById('video-modal');
      const content = document.getElementById('video-modal-content');
      const player = document.getElementById('modal-video-player');

      document.body.style.overflow = '';

      modal.classList.add('opacity-0');
      content.classList.add('scale-95');

      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.body.classList.remove('video-modal-open');
        player.pause();
        player.removeAttribute('src');
        player.load();
      }, 300);
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        const modal = document.getElementById('video-modal');
        if (modal && !modal.classList.contains('hidden')) closeVideoModal();
      }
    });
  </script>

            <h3 class="text-xl font-black text-text-main mt-8 mb-3">Core Prompting Strategies</h3>

            <h3 class="text-xl font-black text-text-main mt-8 mb-3">The RAG Pipeline</h3>
            <ol class="space-y-3 list-decimal pl-5">
              <li><strong>Data Ingestion & Chunking:</strong> Thousands of enterprise PDFs, Word docs, and databases are chopped into small "chunks" of text.</li>

              baseUrl: new URL(response.url).origin
            };
          }
        } catch (error) {
          console.warn(`Video API unavailable at ${apiUrl}`, error);
        }
      }

      throw new Error('No video API endpoint is available');
    }

    async function initApp() {
      const navContainer = document.getElementById('inner-nav-container');

      // Build Top Inner Navigation
      Object.keys(aiData).forEach(key => {
        const item = aiData[key];
        const btn = document.createElement('button');
        btn.className = `nav-pill flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold border border-transparent ${key === 'home' ? 'active' : 'text-text-secondary hover:border-white'}`;
        btn.id = `nav-${key}`;
        btn.onclick = () => loadTopic(key);

        btn.innerHTML = `
          <span class="material-symbols-outlined nav-icon text-[18px] ${key === 'home' ? 'text-white' : 'text-text-secondary'}">${item.icon}</span>
          ${item.navLabel}
        `;
        navContainer.appendChild(btn);
      });

      loadTopic(activeTopicKey);

      // Load videos after the page shell is already visible.
      try {
        const catalog = await fetchVideoCatalog();
        const videoBaseUrl = catalog.baseUrl || API_BASE_URL;
        catalog.data.videos.forEach(video => {
          const parts = video.blob_name.split('/');
          if (parts.length > 0) {
            const category = videoTopicMap[parts[0].trim().toLowerCase()];
            if (category && aiData[category]) {
              aiData[category].videos.push({
                title: video.title,
                img: new URL(video.thumbnail_url, videoBaseUrl).href,
                url: new URL(video.video_url, videoBaseUrl).href
              });
            }
          }
        });
        videoCatalogStatus = '';
      } catch (error) {
        console.error("Failed to load AI videos from API:", error);
        videoCatalogStatus = 'The video library is unavailable.';
      }

      loadTopic(activeTopicKey);
    }

    // --- CONTENT SWITCHING LOGIC ---
    function loadTopic(key) {
      const data = aiData[key];
      activeTopicKey = key;
      const heroContainer = document.getElementById('dynamic-hero-text');
      const readingPane = document.getElementById('reading-pane');
      const resourcePane = document.getElementById('resource-pane');

      // 1. Update Navigation Styles
      document.querySelectorAll('.nav-pill').forEach(btn => {
        btn.classList.remove('active');
        btn.classList.add('text-text-secondary', 'hover:border-white');
        btn.querySelector('.nav-icon').classList.remove('text-white');
        btn.querySelector('.nav-icon').classList.add('text-text-secondary');
      });
      const activeBtn = document.getElementById(`nav-${key}`);
      activeBtn.classList.add('active');
      activeBtn.classList.remove('text-text-secondary', 'hover:border-white');
      activeBtn.querySelector('.nav-icon').classList.add('text-white');
      activeBtn.querySelector('.nav-icon').classList.remove('text-text-secondary');

      // 2. Update Hero Text Dynamically
      heroContainer.innerHTML = `
        <div class="max-w-3xl fade-enter">
          <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-4 text-white leading-tight drop-shadow-md">
            ${data.title}
          </h1>
          <p class="text-lg text-white/95 leading-relaxed font-bold mb-6 drop-shadow-sm">
            ${data.subtitle}
          </p>
        </div>
      `;

      // 3. Build Video Carousel HTML if videos exist
      let videoHTML = '';
      if (data.videos && data.videos.length > 0) {
        let cards = data.videos.map(vid => `
          <!-- FIXED WIDTH AND MODAL ONCLICK -->
          <div onclick="openVideoModal('${vid.url}')" class="block w-[280px] sm:w-[320px] flex-none bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden group cursor-pointer snap-start relative transition-transform hover:-translate-y-1">
            <div class="relative w-full h-40 bg-gray-900 overflow-hidden">
              <img src="${vid.img}" class="w-full h-full object-cover opacity-80 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500" onerror="handleThumbnailError(this, '${vid.img}')" />
              <div class="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-white text-[48px] opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all drop-shadow-md">play_circle</span>
              </div>
            </div>
            <div class="p-4">
              <h4 class="font-bold text-text-main text-sm line-clamp-2 group-hover:text-primary transition-colors leading-snug">${vid.title}</h4>
            </div>
          </div>
        `).join('');

        videoHTML = `
          <div class="mb-10 fade-enter" data-video-carousel>
            <div class="flex items-center justify-between gap-4 mb-4">
              <h3 class="text-sm font-black text-text-main uppercase tracking-widest flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-[20px]">smart_display</span> Micro-Lessons
              </h3>
              <div class="video-carousel-controls" role="group" aria-label="Micro-Lessons navigation">
                <button type="button" aria-label="Scroll videos left" title="Scroll videos left" onclick="scrollVideoCarousel(this, -1)">
                  <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
                </button>
                <button type="button" aria-label="Scroll videos right" title="Scroll videos right" onclick="scrollVideoCarousel(this, 1)">
                  <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
                </button>
              </div>
            </div>
            <div class="video-carousel-track flex gap-4 overflow-x-auto pb-2 snap-x custom-scrollbar">
              ${cards}
            </div>
          </div>
        `;
      } else if (videoCatalogStatus) {
        videoHTML = `
          <div class="mb-10 rounded-xl border border-gray-200 bg-white px-5 py-4 text-sm text-text-secondary" role="status" aria-live="polite">
            ${videoCatalogStatus}
          </div>
        `;
      }

      // 4. Inject Video Carousel + Reading Pane Content
      readingPane.innerHTML = `
        <div class="h-full flex flex-col">
          ${videoHTML}
          ${key !== 'home' ? buildTopicGraph(key) : ''}
          <div class="fade-enter" style="animation-delay: 0.1s; opacity: 0; animation-fill-mode: forwards;">
            ${data.content}
          </div>
        </div>
      `;

      // 5. Inject Resource Pane Content
      resourcePane.innerHTML = '';
      if (data.resources && data.resources.length > 0) {
        data.resources.forEach((res, index) => {
          const delay = index * 0.1;
          resourcePane.innerHTML += `
            <a href="${res.url || '#'}" ${res.url ? 'target="_blank" rel="noopener noreferrer"' : ''} class="resource-card p-4 rounded-2xl flex items-start gap-3 fade-enter" style="animation-delay: ${delay}s; opacity: 0;">
              <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shrink-0 shadow-sm border border-gray-100">
                <span class="material-symbols-outlined ${res.color} text-[20px]">${res.icon}</span>
              </div>
              <div class="flex flex-col justify-center min-h-[40px]">
                <h4 class="text-[14px] font-bold text-text-main leading-tight">${res.name}</h4>
                <p class="text-[12px] text-text-secondary font-medium mt-1">${res.size}</p>
              </div>
            </a>
          `;
        });
      } else {
        resourcePane.innerHTML = `<p class="text-sm text-text-secondary italic fade-enter">No specific resources attached.</p>`;
      }
    }

    // Boot App
    document.addEventListener('DOMContentLoaded', initApp, { once: true });
  </script>

  <script src="assets/common.js"></script>
</body>

</html>
