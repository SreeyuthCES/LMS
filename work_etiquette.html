<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Etiquette · CES Learning Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

  <!-- Official Fonts & Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/common.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#4A82A3",
            "primary-light": "#6BA3C2",
            "primary-dark": "#2B4C5E",
            "text-main": "#2C1E16",
            "text-secondary": "#5C473D",
            "border-light": "#E8E2D9",
          },
          fontFamily: { display: ["Manrope", "sans-serif"] }
        }
      }
    }
  </script>

  <style>
    /* Global Background */
    body {
      font-family: 'Manrope', sans-serif;
      color: #2C1E16;
      background-color: #FAFAFA;
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(74, 130, 163, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(138, 117, 107, 0.05) 0%, transparent 50%),
        linear-gradient(135deg, #FFFFFF 0%, #F4EFE6 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(74, 130, 163, 0.4); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(74, 130, 163, 0.8); }

    /* Edge-to-Edge Hero Image */
    .hero-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 400px;
      z-index: 0;
    }
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    .hero-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(44, 30, 22, 0.8) 0%, rgba(44, 30, 22, 0.95) 60%, rgba(250, 250, 250, 1) 100%);
    }

    /* Glass Cards */
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(249, 246, 243, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px -5px rgba(44, 30, 22, 0.08);
      border-radius: 1.5rem;
    }

    /* Interactive Sidebar Nav */
    .toc-btn {
      transition: all 0.3s ease;
      border-left: 3px solid transparent;
      text-align: left;
      width: 100%;
      cursor: pointer;
    }
    .toc-btn:hover {
      background: rgba(74, 130, 163, 0.05);
      border-left-color: rgba(74, 130, 163, 0.3);
    }
    .toc-btn.active {
      background: rgba(74, 130, 163, 0.1);
      border-left-color: #4A82A3;
      color: #4A82A3;
      font-weight: 800;
    }

    /* Custom Check/Cross lists */
    .list-do li::before { content: 'check_circle'; font-family: 'Material Symbols Outlined'; color: #059669; position: absolute; left: 0; font-size: 20px; }
    .list-dont li::before { content: 'cancel'; font-family: 'Material Symbols Outlined'; color: #E11D48; position: absolute; left: 0; font-size: 20px; }
    .custom-list li { position: relative; padding-left: 28px; margin-bottom: 12px; font-weight: 500; font-size: 14px; color: #5C473D; }

    /* Content Switching Animation */
    .fade-enter { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================
       ADDED: VISUAL LEARNING LAYER
       ============================ */
    .visual-learning-card {
      background: linear-gradient(135deg, rgba(255,255,255,.97), rgba(247,244,239,.92));
      border: 1px solid rgba(74,130,163,.14);
      box-shadow: 0 14px 40px -18px rgba(44,30,22,.22);
      border-radius: 1.5rem;
    }

    .story-reel {
      height: 540px;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(74,130,163,.45) transparent;
      border-radius: 1.25rem;
      background: #111827;
    }

    .story-slide {
      position: relative;
      min-height: 100%;
      scroll-snap-align: start;
      overflow: hidden;
      background: #111827;
    }

    .story-slide img {
      width: 100%;
      height: 100%;
      min-height: 540px;
      object-fit: cover;
      display: block;
    }

    .story-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(17,24,39,.92) 0%, rgba(17,24,39,.15) 55%, rgba(17,24,39,.05) 100%);
      pointer-events: none;
    }

    .story-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 28px 24px;
      color: white;
    }

    .story-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.4);
      transition: all .25s ease;
    }

    .story-dot.active {
      width: 22px;
      background: white;
    }

    .scenario-option {
      transition: transform .2s ease, border-color .2s ease, background-color .2s ease;
    }

    .scenario-option:hover {
      transform: translateY(-2px);
      border-color: rgba(74,130,163,.5);
      background: rgba(74,130,163,.05);
    }

    .scenario-feedback {
      display: none;
      animation: fadeIn .3s ease-out forwards;
    }

    .scenario-feedback.show {
      display: block;
    }

    .quick-chip {
      transition: all .2s ease;
    }

    .quick-chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -10px rgba(44,30,22,.35);
    }

    @media (max-width: 767px) {
      .story-reel { height: 460px; }
      .story-slide img { min-height: 460px; }
    }

    /* Profile Menu */
    .profile-menu .dropdown-content {
      opacity: 0; visibility: hidden; transform: translateY(-10px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .profile-menu:hover .dropdown-content, .profile-menu:focus-within .dropdown-content {
      opacity: 1; visibility: visible; transform: translateY(0);
    }

    /* ===== Workplace Learning Experience Upgrade ===== */
    .learning-rail {
      position: fixed;
      left: 18px;
      top: 92px;
      width: 68px;
      z-index: 40;
      transition: width .28s cubic-bezier(.16,1,.3,1);
    }
    .learning-rail:hover,
    .learning-rail:focus-within { width: 252px; }
    .learning-rail-inner {
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 16px 40px -18px rgba(44,30,22,.25);
      border-radius: 20px;
      padding: 8px;
      overflow: hidden;
    }
    .rail-brand {
      height: 40px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 10px;
      margin-bottom:6px;
      white-space:nowrap;
      color:#2B4C5E;
    }
    .rail-brand .rail-title,
    .rail-label {
      opacity:0;
      transform:translateX(-6px);
      transition:opacity .18s ease, transform .18s ease;
      pointer-events:none;
    }
    .learning-rail:hover .rail-brand .rail-title,
    .learning-rail:focus-within .rail-brand .rail-title,
    .learning-rail:hover .rail-label,
    .learning-rail:focus-within .rail-label {
      opacity:1; transform:translateX(0);
    }
    .rail-btn {
      height:46px;
      width:100%;
      display:flex;
      align-items:center;
      gap:13px;
      border-radius:13px;
      color:#5C473D;
      transition:all .2s ease;
      overflow:hidden;
      white-space:nowrap;
      padding:0 12px;
    }
    .rail-btn:hover { background:rgba(74,130,163,.07); color:#4A82A3; }
    .rail-btn.active { background:rgba(74,130,163,.12); color:#4A82A3; font-weight:800; }
    .rail-btn .material-symbols-outlined { min-width:20px; text-align:center; }
    .rail-label { font-size:12px; font-weight:800; }
    .rail-hint {
      font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.14em;
      color:#8a756b; padding:8px 10px 5px; white-space:nowrap;
    }
    .topic-launcher {
      position:relative; overflow:hidden; border-radius:24px;
      min-height:300px; margin-bottom:10px;
      background:#111827; box-shadow:0 18px 50px -24px rgba(44,30,22,.35);
    }
    .topic-launcher img { width:100%; height:100%; min-height:300px; object-fit:cover; display:block; }
    .topic-launcher::after {
      content:""; position:absolute; inset:0;
      background:linear-gradient(90deg,rgba(17,24,39,.92) 0%,rgba(17,24,39,.62) 48%,rgba(17,24,39,.12) 100%);
    }
    .launcher-content { position:absolute; z-index:2; inset:0; padding:28px; color:#fff; display:flex; align-items:center; }
    .launcher-copy { max-width:610px; }
    .launcher-kicker { font-size:10px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:#9fd0e8; }
    .launcher-title { font-size:clamp(24px,3vw,38px); line-height:1.08; font-weight:900; margin-top:7px; }
    .launcher-desc { color:rgba(255,255,255,.78); font-size:13px; line-height:1.65; margin-top:10px; max-width:560px; }
    .launcher-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    .launcher-pill {
      border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.1);
      backdrop-filter:blur(8px); border-radius:999px; padding:9px 12px;
      font-size:11px; font-weight:800; color:#fff; transition:.2s;
    }
    .launcher-pill:hover { background:rgba(255,255,255,.2); transform:translateY(-1px); }
    .launcher-widget {
      position:absolute; z-index:3; right:24px; bottom:24px; width:min(310px,38%);
      background:rgba(255,255,255,.94); color:#2C1E16; border-radius:18px; padding:15px;
      box-shadow:0 16px 40px -20px rgba(0,0,0,.45); backdrop-filter:blur(12px);
    }
    .launcher-widget button { transition:.2s; }
    .launcher-widget button:hover { transform:translateY(-1px); }
    .mini-progress { height:6px; background:#e8e2d9; border-radius:99px; overflow:hidden; }
    .mini-progress > span { display:block; height:100%; background:#4A82A3; border-radius:99px; transition:width .35s ease; }
    .flip-card { perspective:1000px; cursor:pointer; min-height:145px; }
    .flip-inner { position:relative; width:100%; height:100%; min-height:145px; transition:transform .55s; transform-style:preserve-3d; }
    .flip-card.flipped .flip-inner { transform:rotateY(180deg); }
    .flip-front,.flip-back { position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; padding:18px; }
    .flip-back { transform:rotateY(180deg); }
    .choice-selected { outline:2px solid #4A82A3; outline-offset:2px; }
    .builder-output { transition:.25s; }
    .rail-desktop-spacer { display:block; }
    @media (min-width:1024px) {
      .learning-shell { padding-left:84px; }
    }
    @media (max-width:1023px) {
      .learning-rail { position:sticky; left:auto; top:70px; width:100%; margin:0 0 12px; }
      .learning-rail:hover,.learning-rail:focus-within { width:100%; }
      .learning-rail-inner { display:flex; gap:6px; padding:6px; overflow-x:auto; }
      .rail-brand,.rail-hint { display:none; }
      .rail-btn { width:46px; min-width:46px; justify-content:center; padding:0; }
      .rail-label { display:none; }
      .topic-launcher { min-height:390px; }
      .topic-launcher img { min-height:390px; }
      .launcher-widget { position:relative; right:auto; bottom:auto; width:auto; margin:18px 18px 18px auto; max-width:300px; }
      .launcher-content { align-items:flex-start; padding:24px; padding-bottom:120px; }
    }


    /* Professional information-slide layer: no stock/person imagery */
    .info-launcher {
      background: linear-gradient(145deg,#ffffff,rgba(249,246,243,.96));
      border:1px solid rgba(74,130,163,.16);
      border-radius:24px;
      padding:26px;
      margin-bottom:30px;
      box-shadow:0 18px 45px -28px rgba(44,30,22,.35);
    }
    .info-slide-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    .info-kicker,.info-counter { font-size:10px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:#4A82A3; }
    .info-counter { color:#7B6B63; }
    .info-slide-grid { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr); gap:26px; align-items:start; }
    .info-launcher h3 { font-size:clamp(22px,2.2vw,32px); line-height:1.08; font-weight:900; color:#2B4C5E; margin:0 0 10px; }
    .info-launcher p { color:#6B5A52; font-size:14px; line-height:1.7; }
    .principle-map,.message-stack,.meeting-timeline,.ownership-map { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .principle-map button,.message-stack div,.meeting-timeline button,.ownership-map button {
      border:1px solid rgba(74,130,163,.13); border-radius:15px; padding:14px; text-align:left; background:#F9F6F3; transition:.2s;
    }
    .principle-map button:hover,.principle-map button.selected,.meeting-timeline button:hover,.meeting-timeline button.selected,.ownership-map button:hover,.ownership-map button.selected,
    .practice-panel button:hover,.practice-panel button.selected,.decision-tabs button:hover,.decision-tabs button.selected,.presentation-actions button:hover,.presentation-actions button.selected {
      border-color:#4A82A3; background:rgba(74,130,163,.09); transform:translateY(-1px);
    }
    .principle-map span,.message-stack span,.meeting-timeline span,.ownership-map span { display:block; font-size:10px; font-weight:900; color:#4A82A3; margin-bottom:6px; }
    .principle-map b,.message-stack b,.meeting-timeline b,.ownership-map b { display:block; font-size:13px; color:#2B4C5E; }
    .principle-map small,.message-stack small,.meeting-timeline small,.ownership-map small { color:#7B6B63; font-size:11px; line-height:1.4; }
    .info-output,.decision-output { margin-top:16px; padding:14px 16px; border-radius:14px; background:#EEF5F8; border-left:3px solid #4A82A3; color:#536A75; font-size:13px; line-height:1.6; }
    .practice-panel { background:#2B4C5E; color:white; border-radius:18px; padding:22px; }
    .practice-panel p { color:white; }
    .practice-label { font-size:9px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
    .practice-panel button,.decision-tabs button,.presentation-actions button { display:block; width:100%; text-align:left; padding:11px 13px; margin-top:9px; border:1px solid rgba(255,255,255,.18); border-radius:11px; background:rgba(255,255,255,.08); color:inherit; font-size:12px; transition:.2s; }
    .decision-board,.timeline-slide,.presentation-slide,.team-slide { display:grid; gap:20px; }
    .decision-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .decision-tabs button,.presentation-actions button { background:#F9F6F3; border:1px solid rgba(74,130,163,.13); color:#2B4C5E; }
    .slide-wireframe { background:#17242B; border-radius:18px; min-height:220px; padding:22px; color:white; display:flex; flex-direction:column; justify-content:space-between; }
    .wire-label { font-size:12px; font-weight:900; letter-spacing:.12em; }
    .wire-chart { height:110px; display:flex; align-items:flex-end; gap:12px; padding:0 15%; }
    .wire-chart i { display:block; flex:1; background:#6BA3C2; border-radius:5px 5px 0 0; }
    .wire-footer { display:flex; justify-content:space-between; font-size:10px; opacity:.7; }
    .presentation-slide { grid-template-columns:1fr .8fr .65fr; align-items:center; }
    .presentation-actions { background:#F9F6F3; padding:14px; border-radius:16px; }
    .team-slide > .ownership-map { margin-top:2px; }
    @media(max-width:900px) {
      .info-slide-grid,.presentation-slide { grid-template-columns:1fr; }
      .decision-tabs { grid-template-columns:1fr; }
    }

<div class="game-intro"><div><h3>Choose the response that protects trust</h3><p>There is often more than one possible reaction. Follow the path that keeps the conversation factual and constructive.</p></div><div class="path-label" id="conduct-path-label">START →</div></div>
          <div class="decision-path">
            <div class="path-node active"><b>Situation</b><span id="conduct-situation">A colleague disagrees with your approach in a meeting.</span></div><div class="path-arrow">↓</div>
            <div class="path-choices"><button onclick="playConduct('attack')">Make it personal</button><button onclick="playConduct('explore')">Ask for their reasoning</button><button onclick="playConduct('avoid')">Ignore the disagreement</button></div>
            <div id="conduct-game-feedback" class="game-feedback">Choose a response to reveal the next step.</div>
            <button class="launcher-reset light-reset" onclick="resetConductGame()">↻ Reset activity</button>
          </div>
        </section>`,
      meetings: `

        <section class="info-launcher game-launcher">
          
          <div class="topic-top-row">
            <div class="topic-top-copy">
              <span class="info-kicker topic-index">04 · Meetings &amp; time</span>
              <h3 class="topic-top-heading">Make time together count</h3>
              <p class="topic-top-note">Plan focused meetings, respect others’ schedules and leave with clear decisions and owners.</p>
            </div>
            <div class="topic-image-frame">
              <div class="topic-image-preview" id="topic-preview-meetings">
                <div class="image-slot-empty" id="topic-empty-meetings"><span class="material-symbols-outlined">add_photo_alternate</span><strong>No image added yet</strong><small>Use the button below to add one.</small></div>
              </div>
            </div>
          </div>
          <div class="info-slide-head"><span class="info-counter">CALENDAR CHALLENGE</span></div>
<div class="game-intro"><div><h3>You have 30 minutes. Design the meeting.</h3><p>Choose what deserves live discussion. The goal is not to fill the calendar — it is to use shared time well.</p></div><div class="time-budget"><b id="meeting-minutes">30</b><span>minutes left</span></div></div>
          <div class="meeting-board">
            <div class="meeting-visual"><div class="clock-ring"><strong id="clock-number">30</strong><span>MIN</span></div>
              <div id="meeting-route" class="meeting-route" aria-live="polite"></div>
            </div>
            <div class="meeting-actions">
              <button onclick="spendMeeting(5,'Purpose')"><b>+5</b><span>Define the decision</span></button>
              <button onclick="spendMeeting(10,'Discussion')"><b>+10</b><span>Discuss the blocker</span></button>
              <button onclick="spendMeeting(10,'Decision')"><b>+10</b><span>Make the decision</span></button>
              <button onclick="spendMeeting(5,'Close')"><b>+5</b><span>Confirm owners</span></button>
            </div>
          </div>
          <div id="meeting-game-feedback" class="game-feedback">Build a purposeful 30-minute flow. Try to use all the time.</div>
          <button class="launcher-reset light-reset" onclick="resetMeetingGame()">↻ Reset activity</button>
        </section>
        `,
      presentation: `

        <section class="info-launcher game-launcher">
          
          <div class="topic-top-row">
            <div class="topic-top-copy">
              <span class="info-kicker topic-index">05 · Presentation skills</span>
              <h3 class="topic-top-heading">Present ideas people remember</h3>
              <p class="topic-top-note">Shape clear, focused presentations that make the message easy for your audience to follow.</p>
            </div>
            <div class="topic-image-frame">
              <div class="topic-image-preview" id="topic-preview-presentation">
                <div class="image-slot-empty" id="topic-empty-presentation"><span class="material-symbols-outlined">add_photo_alternate</span><strong>No image added yet</strong><small>Use the button below to add one.</small></div>
              </div>
            </div>
          </div>
          <div class="info-slide-head"><span class="info-counter">SLIDE DETECTIVE</span></div>
<div class="game-intro"><div><h3>Can you spot what makes a slide harder to understand?</h3><p>Click the problem areas in this fictional slide. Good presentation etiquette includes making information easy for the audience to process.</p></div><div class="detective-score"><b id="slide-score">0 / 3</b><span>issues found</span></div></div>
          <div class="fake-slide">
            <button class="hotspot hotspot-title" onclick="findSlideIssue('title',this)">TITLE</button>
            <button class="hotspot hotspot-chart" onclick="findSlideIssue('chart',this)"><span></span><span></span><span></span><span></span></button>
            <button class="hotspot hotspot-footer" onclick="findSlideIssue('footer',this)">WHAT SHOULD I NOTICE?</button>
            <div class="slide-copy"><small>QUARTERLY UPDATE</small><h4>Performance</h4><p>Here are some numbers from the quarter.</p><div class="slide-bars"><i></i><i></i><i></i><i></i></div><em>47% · 61% · 54% · 68%</em></div>
          </div>
          <div id="slide-game-feedback" class="game-feedback">Find three issues: the title, visual message and takeaway.</div>
          <button class="launcher-reset light-reset" onclick="resetSlideGame()">↻ Reset activity</button>
        </section>
        `,
      teamwork: `

        <section class="info-launcher game-launcher">
          
          <div class="topic-top-row">
            <div class="topic-top-copy">
              <span class="info-kicker topic-index">06 · Teamwork &amp; leadership</span>
              <h3 class="topic-top-heading">Make teamwork work</h3>
              <p class="topic-top-note">Build trust through shared ownership, thoughtful support and reliable handoffs.</p>
            </div>
            <div class="topic-image-frame">
              <div class="topic-image-preview" id="topic-preview-teamwork">
                <div class="image-slot-empty" id="topic-empty-teamwork"><span class="material-symbols-outlined">add_photo_alternate</span><strong>No image added yet</strong><small>Use the button below to add one.</small></div>
              </div>
            </div>
          </div>
          <div class="info-slide-head"><span class="info-counter">HANDOFF PUZZLE</span></div>
<div class="game-intro"><div><h3>Put the team handoff in the right order</h3><p>Good collaboration is a sequence: someone does the work, someone owns the outcome, the right people advise, and stakeholders stay informed.</p></div><div class="handoff-score"><b id="handoff-score">0 / 4</b><span>steps placed</span></div></div>
          <div class="handoff-game">
            <div class="handoff-slots"><div data-slot="0">1</div><div data-slot="1">2</div><div data-slot="2">3</div><div data-slot="3">4</div></div>
            <div class="handoff-cards"><button onclick="placeHandoff('R',this)"><b>R</b><span>Responsible</span></button><button onclick="placeHandoff('A',this)"><b>A</b><span>Accountable</span></button><button onclick="placeHandoff('C',this)"><b>C</b><span>Consulted</span></button><button onclick="placeHandoff('I',this)"><b>I</b><span>Informed</span></button></div>
            <div id="handoff-feedback" class="game-feedback">Tap the role that should be placed next in the handoff.</div>
            <button class="launcher-reset" onclick="resetHandoffGame()">↻ Reset activity</button>
          </div>
        </section>`
    };

    const radarScenarios = [
      {
        title: 'A deadline is slipping',
        situation: 'You realise a task will not be ready by the time you promised. What do you do?',
        choices: ['Wait until it is finished, then explain the delay.', 'Flag it early, explain the impact and propose a revised commitment.', 'Ask someone else to handle it without explaining the context.'],
        answer: 'B',
        explanation: 'Good call. Early, clear communication gives the team time to adjust.'
      },
      {
        title: 'A message is unclear',
        situation: 'A colleague sends a request with no deadline or background. What is the most useful next step?',
        choices: ['Ask what outcome they need and when they need it.', 'Guess what they mean and start immediately.', 'Forward it to the whole team and ask someone to decide.'],
        answer: 'A',
        explanation: 'Right. Clarifying the outcome and timing prevents avoidable rework.'
      },
      {
        title: 'A meeting is running over',
        situation: 'The group has reached the scheduled end, but one topic remains. What do you do?',
        choices: ['Keep talking until every detail is settled.', 'End without assigning any follow-up.', 'Summarise the decision, assign an owner and agree whether more time is needed.'],
        answer: 'C',
        explanation: 'Exactly. Close with an owner and a deliberate next step.'
      }
    ];
    let radarIndex = 0;
    let radarScore = 0;
    let radarLocked = false;
    const messageParts = {
      context: { label: 'Context', text: 'We are preparing the Friday client review and need the latest regional figures.' },
      ask: { label: 'Clear ask', text: 'Please add your region’s figures to the shared report.' },
      timing: { label: 'Timing', text: 'Please update it by 2 pm Thursday.' },
      outcome: { label: 'Outcome', text: 'I will combine the updates and send the final version to the client.' }
    };
    const selectedMessageParts = new Set();
    const slideIssues = {
      title: 'Use a takeaway as the title so the audience knows the point.',
      chart: 'Label the chart and highlight the comparison that matters.',
      footer: 'Replace the vague prompt with a clear, evidence-based takeaway.'
    };
    let foundSlideIssues = new Set();
    let meetingMinutes = 30;
    let meetingSteps = [];
    let handoffIndex = 0;
    const handoffOrder = ['R', 'A', 'C', 'I'];
    const handoffLabels = { R: 'Responsible', A: 'Accountable', C: 'Consulted', I: 'Informed' };

    function renderRadarScenario() {
      const scenario = radarScenarios[radarIndex];
      const game = document.getElementById('radar-game');
      if (!scenario || !game) return;
      game.querySelector('#radar-number').textContent = `SCENARIO ${radarIndex + 1} OF ${radarScenarios.length}`;
      game.querySelector('#radar-title').textContent = scenario.title;
      game.querySelector('#radar-situation').textContent = scenario.situation;
      game.querySelectorAll('.scenario-options button').forEach((button, index) => {
        button.disabled = false;
        button.querySelector('b').textContent = String.fromCharCode(65 + index);
        button.querySelector('span').textContent = scenario.choices[index];
      });
      game.querySelector('#radar-feedback').textContent = 'Choose an option to continue.';
      document.getElementById('radar-score').textContent = `${radarScore} / ${radarScenarios.length}`;
      document.getElementById('radar-bar').style.width = `${(radarScore / radarScenarios.length) * 100}%`;
      game.querySelector('.radar-next')?.remove();
      radarLocked = false;
    }

    function playRadar(choice) {
      if (radarLocked || !radarScenarios[radarIndex]) return;
      const scenario = radarScenarios[radarIndex];
      const correct = choice === scenario.answer;
      radarLocked = true;
      if (correct) radarScore += 1;
      document.querySelectorAll('#radar-game .scenario-options button').forEach(button => { button.disabled = true; });
      document.getElementById('radar-score').textContent = `${radarScore} / ${radarScenarios.length}`;
      document.getElementById('radar-bar').style.width = `${(radarScore / radarScenarios.length) * 100}%`;
      document.getElementById('radar-feedback').textContent = `${correct ? 'Strong choice.' : `The strongest choice was ${scenario.answer}.`} ${scenario.explanation}`;
      const nextButton = document.createElement('button');
      nextButton.type = 'button';
      nextButton.className = 'launcher-reset radar-next';
      nextButton.textContent = radarIndex === radarScenarios.length - 1 ? 'See result' : 'Next scenario';
      nextButton.addEventListener('click', () => {
        radarIndex += 1;
        if (radarIndex === radarScenarios.length) {
          document.getElementById('radar-number').textContent = 'ACTIVITY COMPLETE';
          document.getElementById('radar-title').textContent = 'Your workplace instinct';
          document.getElementById('radar-situation').textContent = `You made ${radarScore} of ${radarScenarios.length} strong choices.`;
          document.querySelector('#radar-game .scenario-options').hidden = true;
          nextButton.remove();
          radarLocked = true;
          return;
        }
        renderRadarScenario();
      });
      document.getElementById('radar-feedback').after(nextButton);
    }

    function resetRadarGame() {
      radarIndex = 0;
      radarScore = 0;
      const options = document.querySelector('#radar-game .scenario-options');
      if (options) options.hidden = false;
      renderRadarScenario();
    }

    function renderMessageGame() {
      const preview = document.getElementById('message-preview-text');
      if (!preview) return;
      const orderedParts = Object.keys(messageParts).filter(part => selectedMessageParts.has(part));
      preview.textContent = orderedParts.length
        ? orderedParts.map(part => messageParts[part].text).join(' ')
        : 'Hi team, could you help me with this? Choose the building blocks on the left.';
      document.getElementById('message-score').textContent = `${Math.round((orderedParts.length / 4) * 100)}%`;
      document.getElementById('message-status').replaceChildren(...Object.keys(messageParts).map(part => {
        const tag = document.createElement('span');
        tag.textContent = messageParts[part].label;
        tag.classList.toggle('on', selectedMessageParts.has(part));
        return tag;
      }));
    }

    function toggleMessagePart(part, button) {
      if (!messageParts[part]) return;
      if (selectedMessageParts.has(part)) selectedMessageParts.delete(part);
      else selectedMessageParts.add(part);
      button.classList.toggle('selected', selectedMessageParts.has(part));
      renderMessageGame();
    }

    function resetMessageGame() {
      selectedMessageParts.clear();
      document.querySelectorAll('.message-flow button').forEach(button => button.classList.remove('selected'));
      renderMessageGame();
    }

    function playConduct(choice) {
      const outcomes = {
        attack: ['PAUSE →', 'A personal response can damage trust and move attention away from the issue. Keep the discussion about evidence and impact.'],
        explore: ['EXPLORE →', 'Good response. Ask for the reasoning, compare evidence and agree on the best next step together.'],
        avoid: ['REVISIT →', 'Ignoring disagreement leaves risks unresolved. Acknowledge the concern and ask for the facts behind it.']
      };
      const outcome = outcomes[choice];
      if (!outcome) return;
      document.getElementById('conduct-path-label').textContent = outcome[0];
      document.getElementById('conduct-game-feedback').textContent = outcome[1];
      document.querySelectorAll('.path-choices button').forEach(button => { button.disabled = true; });
    }

    function resetConductGame() {
      const label = document.getElementById('conduct-path-label');
      const feedback = document.getElementById('conduct-game-feedback');
      if (!label || !feedback) return;
      label.textContent = 'START →';
      feedback.textContent = 'Choose a response to reveal the next step.';
      document.querySelectorAll('.path-choices button').forEach(button => { button.disabled = false; });
    }

    function spendMeeting(minutes, step) {
      if (minutes > meetingMinutes) {
        document.getElementById('meeting-game-feedback').textContent = `Only ${meetingMinutes} minutes remain. Choose a shorter step or reset the activity.`;
        return;
      }
      meetingMinutes -= minutes;
      meetingSteps.push(step);
      document.getElementById('meeting-minutes').textContent = meetingMinutes;
      document.getElementById('clock-number').textContent = meetingMinutes;
      document.getElementById('meeting-route').replaceChildren(...meetingSteps.map(label => {
        const stepLabel = document.createElement('span');
        stepLabel.textContent = label;
        return stepLabel;
      }));
      document.getElementById('meeting-game-feedback').textContent = meetingMinutes
        ? `${step} added. ${meetingMinutes} minutes remain; make room for a clear close.`
        : `A focused 30-minute meeting: ${meetingSteps.join(' → ')}.`;
      document.querySelectorAll('.meeting-actions button').forEach(button => { button.disabled = meetingMinutes === 0; });
    }

    function resetMeetingGame() {
      meetingMinutes = 30;
      meetingSteps = [];
      const minutes = document.getElementById('meeting-minutes');
      if (!minutes) return;
      minutes.textContent = '30';
      document.getElementById('clock-number').textContent = '30';
      document.getElementById('meeting-route').replaceChildren();
      document.getElementById('meeting-game-feedback').textContent = 'Build a purposeful 30-minute flow. Try to use all the time.';
      document.querySelectorAll('.meeting-actions button').forEach(button => { button.disabled = false; });
    }

    function findSlideIssue(issue, button) {
      if (!slideIssues[issue] || foundSlideIssues.has(issue)) return;
      foundSlideIssues.add(issue);
      button.classList.add('found');
      button.setAttribute('aria-pressed', 'true');
      document.getElementById('slide-score').textContent = `${foundSlideIssues.size} / 3`;
      document.getElementById('slide-game-feedback').textContent = `${slideIssues[issue]} ${foundSlideIssues.size === 3 ? 'You found all three issues.' : ''}`;
    }

    function resetSlideGame() {
      foundSlideIssues.clear();
      const score = document.getElementById('slide-score');
      if (!score) return;
      score.textContent = '0 / 3';
      document.getElementById('slide-game-feedback').textContent = 'Find three issues: the title, visual message and takeaway.';
      document.querySelectorAll('.hotspot').forEach(button => {
        button.classList.remove('found');
        button.removeAttribute('aria-pressed');
      });
    }

    function placeHandoff(role, button) {
      if (role !== handoffOrder[handoffIndex]) {
        document.getElementById('handoff-feedback').textContent = `Not quite. The next role is ${handoffLabels[handoffOrder[handoffIndex]]}.`;
        return;
      }
      const slot = document.querySelector(`[data-slot="${handoffIndex}"]`);
      slot.textContent = handoffLabels[role];
      slot.classList.add('filled');
      button.disabled = true;
      handoffIndex += 1;
      document.getElementById('handoff-score').textContent = `${handoffIndex} / ${handoffOrder.length}`;
      document.getElementById('handoff-feedback').textContent = handoffIndex === handoffOrder.length
        ? 'Handoff complete: do the work, own the outcome, seek input, then keep stakeholders informed.'
        : `${handoffLabels[role]} placed. Choose the next role in the handoff.`;
    }

    function resetHandoffGame() {
      handoffIndex = 0;
      const score = document.getElementById('handoff-score');
      if (!score) return;
      score.textContent = '0 / 4';
      document.querySelectorAll('.handoff-slots [data-slot]').forEach((slot, index) => {
        slot.textContent = String(index + 1);
        slot.classList.remove('filled');
      });
      document.querySelectorAll('.handoff-cards button').forEach(button => { button.disabled = false; });
      document.getElementById('handoff-feedback').textContent = 'Tap the role that should be placed next in the handoff.';
    }

    function initializeTopicActivity(topicId) {
      if (topicId === 'home') resetRadarGame();
      if (topicId === 'comm') resetMessageGame();
      if (topicId === 'conduct') resetConductGame();
      if (topicId === 'meetings') resetMeetingGame();
      if (topicId === 'presentation') resetSlideGame();
      if (topicId === 'teamwork') resetHandoffGame();
    }

    const topicImagePaths = {
      home: "assets/WE_home.png",
      comm: "assets/WE_communication.png",
      conduct: "assets/WE_professional conduct.png",
      meetings: "assets/WE_time management.png",
      presentation: "assets/WE_presentation skills.png",
      teamwork: "assets/WE_teamwork leadership.png"
    };

    function renderTopicImage(topicId){
      const preview=document.getElementById(`topic-preview-${topicId}`);
      const imagePath=topicImagePaths[topicId];
      if(!preview || !imagePath) return;
      preview.innerHTML=`<img src="${imagePath}" alt="${topicId} topic image" onerror="this.hidden=true; this.nextElementSibling.hidden=false"><div class="image-slot-empty" hidden><strong>Image not found</strong></div>`;
    }

    // Tab Switching Logic
    function switchTab(tabId) {
      document.querySelectorAll('.toc-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) activeBtn.classList.add('active');

      const contentPane = document.getElementById('dynamic-content-pane');
      contentPane.innerHTML = (topicLaunchers[tabId] || '') + foundationData[tabId];
      renderTopicImage(tabId);
      initializeTopicActivity(tabId);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('home');
    });
  </script>

  <script src="assets/common.js"></script>
</body>
</html>
