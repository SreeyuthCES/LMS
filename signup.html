<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Premium Sign-Up - Learning Hub</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#4A82A3",
                    "primary-light": "#6BA3C2",
                    "primary-dark": "#2B4C5E",

                    "background-light": "#FFFFFF",
                    "background-dark": "#1E1A17",

                    "surface": "#FFFFFF",
                    "sidebar": "#F4EFE6",
                    "border-light": "#E8E2D9",
                    "text-main": "#2C1E16",
                    "text-muted": "#8A756B",
                },

                fontFamily: {
                    "display": ["Inter", "sans-serif"]
                },

                borderRadius: {
                    "DEFAULT": "0.5rem",
                    "lg": "1rem",
                    "xl": "1.5rem",
                    "full": "9999px"
                },
            },
        },
    }
</script>

<style>
    /* Glassmorphism */

    .glass-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        border: 1px solid rgba(232, 226, 217, 0.8);

        box-shadow:
            0 8px 32px 0 rgba(74, 130, 163, 0.08);
    }

    .dark .glass-card {
        background: rgba(30, 26, 23, 0.85);
        border: 1px solid rgba(107, 163, 194, 0.15);

        box-shadow:
            0 8px 32px 0 rgba(0, 0, 0, 0.25);
    }


    /* Glass inputs */

    .glass-input {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(232, 226, 217, 0.9);
        transition: all 0.3s ease;
    }

    .glass-input:focus-within {
        background: rgba(255, 255, 255, 0.95);
        border-color: #4A82A3;

        box-shadow:
            0 0 0 2px rgba(74, 130, 163, 0.12);
    }

    .dark .glass-input {
        background: rgba(30, 26, 23, 0.7);
        border-color: rgba(107, 163, 194, 0.2);
    }

    .dark .glass-input:focus-within {
        background: rgba(30, 26, 23, 0.95);
        border-color: #6BA3C2;

        box-shadow:
            0 0 0 2px rgba(107, 163, 194, 0.18);
    }


    /* Abstract warm background shapes */

    .blob-1 {
        position: absolute;
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;

        background: radial-gradient(
            circle,
            rgba(74, 130, 163, 0.12) 0%,
            rgba(255, 255, 255, 0) 70%
        );

        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .blob-2 {
        position: absolute;
        bottom: -10%;
        right: -10%;
        width: 60vw;
        height: 60vw;

        background: radial-gradient(
            circle,
            rgba(107, 163, 194, 0.12) 0%,
            rgba(255, 255, 255, 0) 70%
        );

        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .dark .blob-1 {
        background: radial-gradient(
            circle,
            rgba(107, 163, 194, 0.16) 0%,
            rgba(30, 26, 23, 0) 70%
        );
    }

    .dark .blob-2 {
        background: radial-gradient(
            circle,
            rgba(74, 130, 163, 0.14) 0%,
            rgba(30, 26, 23, 0) 70%
        );
    }


    /* Scrollbar */

    ::-webkit-scrollbar {
        width: 8px;
    }

    ::-webkit-scrollbar-track {
        background: #F4EFE6;
    }

    ::-webkit-scrollbar-thumb {
        background: #8A756B;
        border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #5C473D;
    }

    .dark ::-webkit-scrollbar-track {
        background: #1E1A17;
    }

    .dark ::-webkit-scrollbar-thumb {
        background: #4A82A3;
    }
</style>
<link rel="stylesheet" href="assets/common.css">
</head>
<body class="font-display bg-slate-50 text-[#0d141b] antialiased min-h-screen relative overflow-x-hidden selection:bg-primary/20 selection:text-primary">
<!-- Decorative Background Elements -->
<div class="blob-1"></div>
<div class="blob-2"></div>
<!-- Main Container -->
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-8">
<!-- Glassmorphism Card -->
<div class="glass-card relative w-full max-w-[520px] rounded-xl p-8 sm:p-12 z-10 animate-fade-in-up">
<!-- Logo Area -->
<div class="mb-8 flex flex-col items-center text-center">
<div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-primary/10 text-primary shadow-sm">
<span class="material-symbols-outlined text-3xl">school</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-[#0d141b]">
                    Learning Hub
                </h1>
<p class="mt-2 text-base font-normal text-[#4c739a]">
                    Create your enterprise account to get started.
                </p>
</div>
<!-- Sign Up Form -->
<form class="flex flex-col gap-5">
<!-- Name Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold uppercase tracking-wide text-[#0d141b]/80 ml-1" for="fullname">Full Name</label>
<div class="glass-input flex h-12 w-full items-center overflow-hidden rounded-lg px-3">
<span class="material-symbols-outlined mr-2 text-[#4c739a]" style="font-size: 20px;">person</span>
<input class="h-full w-full border-none bg-transparent p-0 text-sm font-medium text-[#0d141b] placeholder-[#4c739a]/60 focus:ring-0" id="fullname" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold uppercase tracking-wide text-[#0d141b]/80 ml-1" for="email">Work Email</label>
<div class="glass-input flex h-12 w-full items-center overflow-hidden rounded-lg px-3">
<span class="material-symbols-outlined mr-2 text-[#4c739a]" style="font-size: 20px;">mail</span>
<input class="h-full w-full border-none bg-transparent p-0 text-sm font-medium text-[#0d141b] placeholder-[#4c739a]/60 focus:ring-0" id="email" placeholder="jane@company.com" type="email"/>
</div>
</div>
<!-- Company ID Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold uppercase tracking-wide text-[#0d141b]/80 ml-1" for="company_id">Company ID</label>
<div class="glass-input flex h-12 w-full items-center overflow-hidden rounded-lg px-3">
<span class="material-symbols-outlined mr-2 text-[#4c739a]" style="font-size: 20px;">domain</span>
<input class="h-full w-full border-none bg-transparent p-0 text-sm font-medium text-[#0d141b] placeholder-[#4c739a]/60 focus:ring-0" id="company_id" placeholder="e.g. ENT-8834" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold uppercase tracking-wide text-[#0d141b]/80 ml-1" for="password">Password</label>
<div class="glass-input flex h-12 w-full items-center overflow-hidden rounded-lg px-3">
<span class="material-symbols-outlined mr-2 text-[#4c739a]" style="font-size: 20px;">lock</span>
<input class="h-full w-full border-none bg-transparent p-0 text-sm font-medium text-[#0d141b] placeholder-[#4c739a]/60 focus:ring-0" id="password" placeholder="••••••••" type="password"/>
<button class="flex items-center justify-center text-[#4c739a] hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="mt-2 flex items-start gap-3 px-1">
<div class="flex h-5 items-center">
<input class="h-4 w-4 rounded border-[#cfdbe7] bg-white text-primary focus:ring-primary/20" id="terms" type="checkbox"/>
</div>
<label class="text-xs font-normal text-[#4c739a]" for="terms">
                        I agree to the <a class="font-medium text-primary hover:underline" href="#">Terms of Service</a> and <a class="font-medium text-primary hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="mt-2 flex h-12 w-full items-center justify-center rounded-lg bg-primary text-sm font-bold text-white shadow-md transition-all hover:bg-blue-500 hover:shadow-lg hover:scale-[1.01] active:scale-[0.98]" type="submit">
                    Create Account
                </button>
</form>
<!-- Footer / Login Link -->
<div class="mt-8 text-center">
<p class="text-sm text-[#4c739a]">
                    Already have an account? 
                    <a class="font-semibold text-primary transition-colors hover:text-blue-600 hover:underline" href="#">Log In</a>
</p>
</div>
<!-- Trust Indicators -->
<div class="mt-8 border-t border-[#cfdbe7]/50 pt-6">
<p class="mb-4 text-center text-xs font-medium uppercase tracking-widest text-[#4c739a]/70">Trusted by industry leaders</p>
<div class="flex items-center justify-center gap-6 opacity-60 grayscale transition-all hover:opacity-100 hover:grayscale-0">
<!-- Placeholder Logos using simple SVGs or text for demo -->
<div class="flex items-center gap-1 font-bold text-slate-500">
<span class="material-symbols-outlined text-xl">landscape</span>
<span class="text-xs">ACME Corp</span>
</div>
<div class="flex items-center gap-1 font-bold text-slate-500">
<span class="material-symbols-outlined text-xl">bolt</span>
<span class="text-xs">EnergyInc</span>
</div>
<div class="flex items-center gap-1 font-bold text-slate-500">
<span class="material-symbols-outlined text-xl">water_drop</span>
<span class="text-xs">BlueWave</span>
</div>
</div>
</div>
</div>
<!-- Bottom Copyright -->
<div class="relative z-10 mt-8 text-center">
<p class="text-xs text-[#4c739a]/60">© 2024 Learning Hub Enterprise. All rights reserved.</p>
</div>
</div>
<script src="assets/common.js"></script>
</body></html>
